<!-- My Drip Nurse · Refund request embed for GoHighLevel -->
<div id="mdn-refund-request" style="width:100%;margin:0;background:#ebf2f9;">
  <iframe
    id="mdn-refund-request-frame"
    src="https://care.mydripnurse.com/refund-request?embed=1"
    title="Request a My Drip Nurse appointment refund"
    loading="eager"
    allow="payment"
    referrerpolicy="strict-origin-when-cross-origin"
    style="display:block;width:100%;height:980px;border:0;background:#ebf2f9;overflow:hidden;"
  ></iframe>
</div>
<script>
  (function () {
    var frame = document.getElementById("mdn-refund-request-frame");
    if (!frame) return;
    window.addEventListener("message", function (event) {
      if (event.origin !== "https://care.mydripnurse.com") return;
      if (!event.data || event.data.type !== "mdn-refund-resize") return;
      var height = Number(event.data.height || 0);
      if (!Number.isFinite(height) || height < 420 || height > 4000) return;
      frame.style.height = Math.ceil(height + 8) + "px";
    });
  })();
</script>
